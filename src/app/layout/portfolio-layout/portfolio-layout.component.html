<div class="layout rt-page">
  <div class="layout__orbs" aria-hidden="true">
    <div class="layout__orb layout__orb--pink"></div>
    <div class="layout__orb layout__orb--blue"></div>
  </div>

  <div class="layout__home">
    <aside class="sidebar">
      <div>
        <a class="sidebar__brand" routerLink="/">
          <h1 class="sidebar__title">TU HOANG</h1>
          <p class="sidebar__subtitle">Frontend Engineer</p>
        </a>

        <nav class="sidebar__nav">
          @for (item of navItems; track item.id) {
            <button
              type="button"
              class="sidebar__item"
              [ngClass]="{ 'is-active': activeSection() === item.id }"
              (click)="scrollToSection(item.id)"
            >
              <app-lucide-icon [name]="item.icon" [size]="16"></app-lucide-icon>
              <span>{{ item.label }}</span>
            </button>
          }
        </nav>
      </div>

      <div>
        <a class="sidebar__resume" href="#" (click)="$event.preventDefault()"
          >Download Resume</a
        >
        <div class="sidebar__social">
          <a
            href="https://github.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
          >
            <app-lucide-icon name="github" [size]="16"></app-lucide-icon>
          </a>
          <a
            href="https://linkedin.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <app-lucide-icon name="linkedin" [size]="16"></app-lucide-icon>
          </a>
          <a
            href="https://instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <app-lucide-icon name="instagram" [size]="16"></app-lucide-icon>
          </a>
          <a href="mailto:htu25399@gmail.com" aria-label="Email">
            <app-lucide-icon name="mail" [size]="16"></app-lucide-icon>
          </a>
        </div>
      </div>
    </aside>

    <main class="layout__content layout__content--home">
      <router-outlet></router-outlet>
    </main>

    <nav class="bottom-nav">
      @for (item of navItems; track item.id) {
        <button
          type="button"
          class="bottom-nav__item"
          [ngClass]="{ 'is-active': activeSection() === item.id }"
          (click)="scrollToSection(item.id)"
        >
          <app-lucide-icon [name]="item.icon" [size]="18"></app-lucide-icon>
          <span>{{ item.label }}</span>
        </button>
      }
    </nav>
  </div>
</div>
