<svg
  xmlns="http://www.w3.org/2000/svg"
  [attr.width]="normalizedSize()"
  [attr.height]="normalizedSize()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="normalizedStrokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  [ngStyle]="{ display: 'block' }"
  [innerHTML]="svgBody()"
></svg>
