<div class="blog">
  <div class="rt-container blog__container">
    <div class="blog__title rt-fade-left">
      <span class="blog__eyebrow">Latest Writings</span>
      <h2 class="blog__heading">Blog</h2>
    </div>

    <div class="blog__grid">
      @for (item of listBlog(); track item.id) {
        <app-blog-item class="blog__item" [blogItem]="item"></app-blog-item>
      }
    </div>
  </div>
</div>
